name: Agent quality gate
on: [push, pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Evaluate v2 without regression
        env:
          AGENT_VERSION: v2
          MOCK_ERROR_RATE: '0'
          MOCK_SLOW_RATE: '0'
        run: |
          set -e
          python app.py > /tmp/agent.log 2>&1 &
          agent_pid=$!
          trap 'kill "$agent_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          python eval/run_eval.py --min-accuracy 1.0 --baseline ../../../reports/eval_v2.json --out /tmp/eval.json
